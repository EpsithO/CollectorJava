global:
  scrape_interval: 15s
  evaluation_interval: 15s
rule_files: [/etc/prometheus/rules.yml]
scrape_configs:
  - job_name: catalogue
    metrics_path: /actuator/prometheus
    static_configs: [{ targets: ["catalogue:8081"] }]
  - job_name: controle
    metrics_path: /actuator/prometheus
    static_configs: [{ targets: ["controle:8081"] }]
  - job_name: notification
    metrics_path: /actuator/prometheus
    static_configs: [{ targets: ["notification:8081"] }]
  - job_name: rabbitmq
    static_configs: [{ targets: ["rabbitmq:15692"] }]
  - job_name: postgres
    static_configs: [{ targets: ["postgres-exporter:9187"] }]
