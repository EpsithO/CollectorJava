# controle-service : contrôle automatique des articles soumis (règle des 3 écarts-types).
# Aucune API publique : le Service n'expose QUE le port de management (sondes, Prometheus), jamais le 8080,
# et aucune règle d'Ingress n'y mène. S'il tombe, les articles attendent EN_CONTROLE : les vendeurs ne sont pas bloqués.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: controle
  labels:
    app.kubernetes.io/name: controle
    app.kubernetes.io/part-of: collector
spec:
  replicas: 2
  strategy:
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  selector:
    matchLabels:
      app.kubernetes.io/name: controle
  template:
    metadata:
      labels:
        app.kubernetes.io/name: controle
        app.kubernetes.io/part-of: collector
        collector.shop/db-client: "true"
        collector.shop/amqp-client: "true"
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8081"
        prometheus.io/path: /actuator/prometheus
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile: { type: RuntimeDefault }
      initContainers:
        - name: wait-for-schema
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent
          # controle_app ne lit que la vue category_price_stats (moindre privilège, ADR 0006).
          command:
            - sh
            - -c
            - |
              until psql -tAc 'SELECT 1 FROM category_price_stats LIMIT 1' >/dev/null 2>&1; do
                echo "vue absente, attente du job Flyway"; sleep 3
              done
          env:
            - { name: PGHOST, value: postgres }
            - { name: PGUSER, value: controle_app }
            - { name: PGDATABASE, value: collector }
            - name: PGPASSWORD
              valueFrom: { secretKeyRef: { name: collector-secrets, key: CONTROLE_DB_PASSWORD } }
          securityContext:
            runAsUser: 70
            runAsGroup: 70
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { cpu: 100m, memory: 64Mi }
      containers:
        - name: controle
          image: collector/controle-service:dev
          imagePullPolicy: IfNotPresent
          ports:
            - { name: management, containerPort: 8081 }
          env:
            - { name: DB_HOST, value: postgres }
            - { name: DB_USER, value: controle_app }
            - name: DB_PASSWORD
              valueFrom: { secretKeyRef: { name: collector-secrets, key: CONTROLE_DB_PASSWORD } }
            - { name: RABBITMQ_HOST, value: rabbitmq }
            - name: RABBITMQ_USER
              valueFrom: { secretKeyRef: { name: rabbitmq-default-user, key: username } }
            - name: RABBITMQ_PASSWORD
              valueFrom: { secretKeyRef: { name: rabbitmq-default-user, key: password } }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: 500m, memory: 512Mi }
          startupProbe:
            httpGet: { path: /actuator/health/liveness, port: management }
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: management }
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: management }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - { name: tmp, emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata:
  name: controle
  labels:
    app.kubernetes.io/name: controle
    app.kubernetes.io/part-of: collector
spec:
  selector:
    app.kubernetes.io/name: controle
  ports:
    - { name: management, port: 8081, targetPort: management }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: controle
  labels:
    app.kubernetes.io/name: controle
    app.kubernetes.io/part-of: collector
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: controle
