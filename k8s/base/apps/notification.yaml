# notification-service : abonnements aux articles et notifications de variation de prix (US-029).
# Consomme price.changed, follow.changed et interests.updated ; sert /api/v1/me/notifications.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification
  labels:
    app.kubernetes.io/name: notification
    app.kubernetes.io/part-of: collector
spec:
  replicas: 2
  strategy:
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  selector:
    matchLabels:
      app.kubernetes.io/name: notification
  template:
    metadata:
      labels:
        app.kubernetes.io/name: notification
        app.kubernetes.io/part-of: collector
        collector.shop/db-client: "true"
        collector.shop/amqp-client: "true"
        collector.shop/oidc-client: "true"
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8081"
        prometheus.io/path: /actuator/prometheus
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile: { type: RuntimeDefault }
      initContainers:
        - name: wait-for-schema
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              until psql -tAc 'SELECT 1 FROM notification LIMIT 1' >/dev/null 2>&1; do
                echo "schéma absent, attente du job Flyway"; sleep 3
              done
          env:
            - { name: PGHOST, value: postgres }
            - { name: PGUSER, value: notification_app }
            - { name: PGDATABASE, value: collector }
            - name: PGPASSWORD
              valueFrom: { secretKeyRef: { name: collector-secrets, key: NOTIFICATION_DB_PASSWORD } }
          securityContext:
            runAsUser: 70
            runAsGroup: 70
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { cpu: 100m, memory: 64Mi }
      containers:
        - name: notification
          image: collector/notification-service:dev
          imagePullPolicy: IfNotPresent
          ports:
            - { name: http, containerPort: 8080 }
            - { name: management, containerPort: 8081 }
          env:
            - { name: DB_HOST, value: postgres }
            - { name: DB_USER, value: notification_app }
            - name: DB_PASSWORD
              valueFrom: { secretKeyRef: { name: collector-secrets, key: NOTIFICATION_DB_PASSWORD } }
            - { name: RABBITMQ_HOST, value: rabbitmq }
            - name: RABBITMQ_USER
              valueFrom: { secretKeyRef: { name: rabbitmq-default-user, key: username } }
            - name: RABBITMQ_PASSWORD
              valueFrom: { secretKeyRef: { name: rabbitmq-default-user, key: password } }
            - { name: OIDC_ISSUER, value: "https://auth.collector.local/realms/collector" }
            - { name: OIDC_JWKS_URL, value: "http://keycloak:8080/realms/collector/protocol/openid-connect/certs" }
            - { name: CORS_ALLOWED_ORIGINS, value: "https://collector.local" }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: 500m, memory: 512Mi }
          startupProbe:
            httpGet: { path: /actuator/health/liveness, port: management }
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: management }
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: management }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - { name: tmp, emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata:
  name: notification
  labels:
    app.kubernetes.io/name: notification
    app.kubernetes.io/part-of: collector
spec:
  selector:
    app.kubernetes.io/name: notification
  ports:
    - { name: http, port: 8080, targetPort: http }
    - { name: management, port: 8081, targetPort: management }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: notification
  labels:
    app.kubernetes.io/name: notification
    app.kubernetes.io/part-of: collector
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: notification
