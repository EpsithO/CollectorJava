# NetworkPolicies : refus par défaut (entrée ET sortie), puis flux explicites.
# Les flux sont exprimés par des LABELS de capacité plutôt que par service, pour rester lisibles :
#   collector.shop/db-client    : parle à PostgreSQL        (services, jobs, exporter)
#   collector.shop/amqp-client  : parle à RabbitMQ          (services)
#   collector.shop/oidc-client  : valide des jetons (JWKS)  (services exposant une API)
#   collector.shop/s3-client    : parle au stockage objet   (catalogue, job d'initialisation)
# Nécessite un CNI qui applique les NetworkPolicies : Calico sur Minikube (--cni=calico). Le kindnet de kind
# les applique selon sa version ; la recette ne doit pas dépendre de leur absence.
#
# Sortie vers l'API Kubernetes (découverte des pairs RabbitMQ, découverte des pods par Prometheus) :
# autorisée sur 443 et 6443 seulement, car l'adresse de l'API varie d'un cluster à l'autre.
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
# Résolution DNS pour tous les pods.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns-egress
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: kube-system }
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
---
# Traefik (namespace traefik) vers les charges exposées : API, notifications, Keycloak, stockage (URL pré-signées).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-traefik-ingress
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values: [catalogue, notification, keycloak, storage]
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: traefik }
      ports:
        - { protocol: TCP, port: 8080 }
        - { protocol: TCP, port: 3900 }
---
# --- PostgreSQL --------------------------------------------------------------------------------------
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-ingress-from-db-clients
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: postgres }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: { collector.shop/db-client: "true" }
      ports:
        - { protocol: TCP, port: 5432 }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: db-clients-egress-to-postgres
spec:
  podSelector:
    matchLabels: { collector.shop/db-client: "true" }
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchLabels: { app.kubernetes.io/name: postgres }
      ports:
        - { protocol: TCP, port: 5432 }
---
# --- RabbitMQ ------------------------------------------------------------------------------------------
# Entrée : les clients AMQP, les nœuds entre eux (clustering, inter-nœuds), l'opérateur, Prometheus.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: rabbitmq-ingress
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: rabbitmq }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: { collector.shop/amqp-client: "true" }
      ports:
        - { protocol: TCP, port: 5672 }
    - from:
        - podSelector:
            matchLabels: { app.kubernetes.io/name: rabbitmq }       # pairs du cluster
    - from:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: rabbitmq-system }   # l'opérateur
    - from:
        - podSelector:
            matchLabels: { app.kubernetes.io/name: prometheus }
      ports:
        - { protocol: TCP, port: 15692 }
    - from:
        - podSelector:
            matchLabels: { collector.shop/perf-test: "true" }       # RabbitMQ PerfTest (overlay sandbox)
      ports:
        - { protocol: TCP, port: 5672 }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: rabbitmq-egress
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: rabbitmq }
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchLabels: { app.kubernetes.io/name: rabbitmq }       # pairs du cluster
    - ports:                                                        # API Kubernetes (découverte des pairs)
        - { protocol: TCP, port: 443 }
        - { protocol: TCP, port: 6443 }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: amqp-clients-egress-to-rabbitmq
spec:
  podSelector:
    matchExpressions:
      - key: collector.shop/amqp-client
        operator: In
        values: ["true"]
      - key: app.kubernetes.io/name
        operator: NotIn
        values: [rabbitmq]
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchLabels: { app.kubernetes.io/name: rabbitmq }
      ports:
        - { protocol: TCP, port: 5672 }
---
# --- Keycloak --------------------------------------------------------------------------------------------
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: keycloak-ingress-from-oidc-clients
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: keycloak }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: { collector.shop/oidc-client: "true" }
      ports:
        - { protocol: TCP, port: 8080 }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: oidc-clients-egress-to-keycloak
spec:
  podSelector:
    matchLabels: { collector.shop/oidc-client: "true" }
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchLabels: { app.kubernetes.io/name: keycloak }
      ports:
        - { protocol: TCP, port: 8080 }
---
# --- Stockage objet ---------------------------------------------------------------------------------------
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: storage-ingress-from-s3-clients
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: storage }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: { collector.shop/s3-client: "true" }
      ports:
        - { protocol: TCP, port: 3900 }
        - { protocol: TCP, port: 3903 }     # API d'administration : Job d'initialisation seulement
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: s3-clients-egress-to-storage
spec:
  podSelector:
    matchLabels: { collector.shop/s3-client: "true" }
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchLabels: { app.kubernetes.io/name: storage }
      ports:
        - { protocol: TCP, port: 3900 }
        - { protocol: TCP, port: 3903 }
---
# --- Observabilité -------------------------------------------------------------------------------------------
# Prometheus interroge les pods annotés (port 8081), RabbitMQ (15692) et l'exporter (9187), et l'API Kubernetes.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: metrics-ingress-from-prometheus
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values: [catalogue, controle, notification, postgres-exporter]
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: { app.kubernetes.io/name: prometheus }
      ports:
        - { protocol: TCP, port: 8081 }
        - { protocol: TCP, port: 9187 }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: prometheus-egress
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: prometheus }
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchLabels: { app.kubernetes.io/part-of: collector }
      ports:
        - { protocol: TCP, port: 8081 }
        - { protocol: TCP, port: 9187 }
    - to:
        - podSelector:
            matchLabels: { app.kubernetes.io/name: rabbitmq }       # pods de l'opérateur : part-of=rabbitmq
      ports:
        - { protocol: TCP, port: 15692 }
    - ports:                                                        # API Kubernetes (découverte des pods)
        - { protocol: TCP, port: 443 }
        - { protocol: TCP, port: 6443 }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: prometheus-ingress-from-grafana
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: prometheus }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: { app.kubernetes.io/name: grafana }
      ports:
        - { protocol: TCP, port: 9090 }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: grafana-egress-to-prometheus
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: grafana }
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchLabels: { app.kubernetes.io/name: prometheus }
      ports:
        - { protocol: TCP, port: 9090 }
