# Stockage objet S3 : Garage (ADR 0008), un nœud. Le bucket privé collector-photos, la clé du catalogue et
# le CORS sont créés par le Job « storage-init » (infra/storage/init.sh, le même script que compose).
# L'image Garage n'a pas de shell : d'où le Job séparé.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: storage
  labels:
    app.kubernetes.io/name: storage
    app.kubernetes.io/part-of: collector
spec:
  serviceName: storage
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: storage
  template:
    metadata:
      labels:
        app.kubernetes.io/name: storage
        app.kubernetes.io/part-of: collector
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: garage
          image: dxflrs/garage:v2.3.0
          imagePullPolicy: IfNotPresent
          ports:
            - { name: api, containerPort: 3900 }
            - { name: rpc, containerPort: 3901 }
            - { name: admin, containerPort: 3903 }
          env:
            - name: GARAGE_RPC_SECRET
              valueFrom: { secretKeyRef: { name: collector-secrets, key: GARAGE_RPC_SECRET } }
            - name: GARAGE_ADMIN_TOKEN
              valueFrom: { secretKeyRef: { name: collector-secrets, key: GARAGE_ADMIN_TOKEN } }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 500m, memory: 256Mi }
          readinessProbe:
            tcpSocket: { port: api }
            periodSeconds: 5
          livenessProbe:
            tcpSocket: { port: api }
            periodSeconds: 20
            initialDelaySeconds: 10
          volumeMounts:
            - { name: config, mountPath: /etc/garage.toml, subPath: garage.toml, readOnly: true }
            - { name: meta, mountPath: /var/lib/garage/meta }
            - { name: data, mountPath: /var/lib/garage/data }
      volumes:
        - name: config
          configMap:
            name: garage-config
  volumeClaimTemplates:
    - metadata:
        name: meta
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 256Mi
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: storage
  labels:
    app.kubernetes.io/name: storage
    app.kubernetes.io/part-of: collector
spec:
  selector:
    app.kubernetes.io/name: storage
  ports:
    - { name: api, port: 3900, targetPort: api }
    - { name: admin, port: 3903, targetPort: admin }   # initialisation seulement : jamais routé par l'Ingress
