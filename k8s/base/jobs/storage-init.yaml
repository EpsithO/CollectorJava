# Initialisation idempotente de Garage : disposition du nœud, clé du catalogue (importée depuis le Secret),
# bucket privé collector-photos, droits limités à ce bucket, CORS. C'est infra/storage/init.sh, empaqueté dans
# l'image construite à partir de infra/storage/Dockerfile (alpine + curl + jq + aws-cli) : deploy.sh la
# construit et la charge dans le cluster (STORAGE_INIT_IMAGE pour un registre). Job immuable : recréé par deploy.sh.
apiVersion: batch/v1
kind: Job
metadata:
  name: storage-init
  labels:
    app.kubernetes.io/name: storage-init
    app.kubernetes.io/part-of: collector
spec:
  backoffLimit: 5
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: storage-init
        app.kubernetes.io/part-of: collector
        collector.shop/s3-client: "true"
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: init
          image: collector/storage-init:dev
          imagePullPolicy: IfNotPresent
          env:
            - { name: HOME, value: /tmp }                            # aws-cli écrit son cache dans $HOME
            - { name: GARAGE_ADMIN_URL, value: "http://storage:3903" }
            - { name: GARAGE_S3_URL, value: "http://storage:3900" }
            - { name: CORS_ORIGIN, value: "https://collector.local" } # origine du front
            - name: GARAGE_ADMIN_TOKEN
              valueFrom: { secretKeyRef: { name: collector-secrets, key: GARAGE_ADMIN_TOKEN } }
            - name: CATALOGUE_S3_ACCESS_KEY
              valueFrom: { secretKeyRef: { name: collector-secrets, key: CATALOGUE_S3_ACCESS_KEY } }
            - name: CATALOGUE_S3_SECRET_KEY
              valueFrom: { secretKeyRef: { name: collector-secrets, key: CATALOGUE_S3_SECRET_KEY } }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 500m, memory: 256Mi }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - { name: tmp, emptyDir: {} }
