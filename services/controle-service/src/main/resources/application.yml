spring:
  application:
    name: controle-service
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:collector}
    username: ${DB_USER:controle_app}    # rôle en lecture seule sur category_price_stats (ADR 0006)
    password: ${DB_PASSWORD}             # pas de valeur par défaut : démarrage refusé si absent
    hikari:
      maximum-pool-size: 5
      connection-timeout: 3s
  flyway:
    enabled: false
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER}
    password: ${RABBITMQ_PASSWORD}
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
    listener:
      simple:
        acknowledge-mode: auto
        prefetch: 10
        default-requeue-rejected: true
  jackson:
    property-naming-strategy: SNAKE_CASE

server:
  port: 8080                              # aucun Service Kubernetes ne l'expose : seul le management sert
  shutdown: graceful

management:
  server:
    port: 8081
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

logging:
  structured:
    format:
      console: ecs

collector:
  publish:
    confirm-timeout: 5s
