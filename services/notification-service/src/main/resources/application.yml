spring:
  application:
    name: notification-service
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:collector}
    username: ${DB_USER:notification_app}   # rôle limité aux tables de ce service
    password: ${DB_PASSWORD}                # pas de valeur par défaut : démarrage refusé si absent
    hikari:
      maximum-pool-size: 10
      connection-timeout: 3s
  flyway:
    enabled: false                          # migrations appliquées par le job Flyway (propriétaire)
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER}
    password: ${RABBITMQ_PASSWORD}
    listener:
      simple:
        acknowledge-mode: auto
        prefetch: 10
        default-requeue-rejected: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OIDC_ISSUER}        # valeur attendue du claim iss (URL publique)
          jwk-set-uri: ${OIDC_JWKS_URL}     # adresse interne : pas de découverte au démarrage
          audiences: notification-api
          jws-algorithms: RS256
  jackson:
    property-naming-strategy: SNAKE_CASE
    deserialization:
      fail-on-unknown-properties: true
  mvc:
    problemdetails:
      enabled: true

server:
  port: 8080
  shutdown: graceful
  error:
    include-stacktrace: never
    include-message: never

management:
  server:
    port: 8081
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true

logging:
  structured:
    format:
      console: ecs

collector:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
